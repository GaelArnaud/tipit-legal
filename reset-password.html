<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset your tipit password</title>
  <style>
    body {
      margin: 0;
      background: #0A0A0A;
      color: #F0F0F0;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #141414;
      border: 0.5px solid #2A2A2A;
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 380px;
      width: 100%;
    }
    h1 { font-size: 22px; margin: 0 0 6px; color: #48AE7E; }
    p { color: #AAAAAA; font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
    label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: #AAAAAA; margin-bottom: 8px; }
    input {
      width: 100%;
      box-sizing: border-box;
      background: #1C1C1C;
      border: 0.5px solid #2A2A2A;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      color: #F0F0F0;
      margin-bottom: 16px;
    }
    button {
      width: 100%;
      background: #48AE7E;
      color: #000;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; }
    .msg { font-size: 13px; padding: 12px; border-radius: 10px; margin-bottom: 16px; }
    .msg.err { background: rgba(255,59,48,0.1); color: #FF3B30; border: 0.5px solid rgba(255,59,48,0.3); }
    .msg.ok { background: rgba(72,174,126,0.1); color: #48AE7E; border: 0.5px solid rgba(72,174,126,0.3); }
    .hint { font-size: 12px; color: #666; text-align: center; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Reset your password</h1>
    <p>Enter a new password for your tipit account.</p>
    <div id="msg"></div>
    <div id="form">
      <label for="pw">New password</label>
      <input type="password" id="pw" minlength="6" placeholder="••••••••" />
      <label for="pw2">Confirm password</label>
      <input type="password" id="pw2" minlength="6" placeholder="••••••••" />
      <button id="submit">Update password</button>
    </div>
    <p class="hint">After updating, open the tipit app and sign in.</p>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL = 'https://gvfnzkecqvmpwvqxxkts.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_oe1Xbk0C02qOrUr_iwTs9w_Xi3z1vt5';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { detectSessionInUrl: true, flowType: 'implicit' }
    });

    const msgEl = document.getElementById('msg');
    const formEl = document.getElementById('form');
    const submitBtn = document.getElementById('submit');

    function showError(text) {
      msgEl.innerHTML = '<div class="msg err">' + text + '</div>';
    }
    function showOk(text) {
      msgEl.innerHTML = '<div class="msg ok">' + text + '</div>';
    }

    // Supabase auto-parses the access_token from the URL hash on load.
    // We wait briefly to let that settle, then verify a session exists.
    setTimeout(async () => {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        showError('Invalid or expired recovery link. Request a new one from the app.');
        formEl.style.display = 'none';
      }
    }, 250);

    submitBtn.addEventListener('click', async () => {
      const pw = document.getElementById('pw').value;
      const pw2 = document.getElementById('pw2').value;
      msgEl.innerHTML = '';
      if (pw.length < 6) return showError('Password must be at least 6 characters.');
      if (pw !== pw2) return showError('Passwords do not match.');

      submitBtn.disabled = true;
      const { error } = await supabase.auth.updateUser({ password: pw });
      submitBtn.disabled = false;
      if (error) return showError(error.message);
      showOk('Password updated. Open the tipit app and sign in with your new password.');
      formEl.style.display = 'none';
    });
  </script>
</body>
</html>
